buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:4.1.+' }
}
apply plugin: 'net.minecraftforge.gradle'
version = '1.0.0'
group = 'com.emanuel.naturaldisasters'
archivesBaseName = 'naturaldisasters'
java.toolchain.languageVersion = JavaLanguageVersion.of(8)
minecraft {
    mappings channel: 'official', version: '1.16.5'
    runs {
        client { workingDirectory project.file('run'); mods { naturaldisasters { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { naturaldisasters { source sourceSets.main } } }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.16.5-36.2.39' }
